name: Auto Deploy ke VPS (SFTP)

on:
  push:
    branches:
      - main
      - solli

jobs:
  deploy:
    name: Deploy Otomatis ke otwapproved.gusaha.id
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode terbaru dari GitHub
        uses: actions/checkout@v4

      - name: Install LFTP untuk transfer SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Siapkan Private SSH Key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          cat <<EOF > ~/.ssh/config
          Host vps_deploy
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${VPS_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config
          echo "ls" | sftp -b - vps_deploy

      - name: Sinkronkan file ke VPS via SFTP
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set sftp:auto-confirm yes;
            set sftp:connect-program \"ssh -a -x -F $HOME/.ssh/config\";
            open -u ${VPS_USER},dummy sftp://vps_deploy;
            mirror --reverse --delete --parallel=4 --verbose app /web/otwapproved.gusaha.id/public_html/app;
            mirror --reverse --parallel=4 --verbose --exclude-glob \"uploads/\" --exclude-glob \"uploads/*\" public /web/otwapproved.gusaha.id/public_html/public;
            cd /web/otwapproved.gusaha.id/public_html;
            mput composer.json composer.lock preload.php spark;
            bye;
          "
